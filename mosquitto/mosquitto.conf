# Mosquitto 2.x - broker MQTT de la plataforma (Lab 5)
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

# sesiones persistentes y mensajes QoS 1 sobreviven a un reinicio del broker
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
